<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Crisis — Episode Directory</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="jokercropped.png" class="banner-img" alt="Time Crisis with Ezra Koenig">
      <div class="controls">
        <input type="search" id="search" placeholder="Search episodes, guests, descriptions…" autocomplete="off">
        <div class="selects">
          <select id="sort">
            <option value="newest">Newest to Oldest</option>
            <option value="oldest">Oldest to Newest</option>
          </select>
        </div>
      </div>
    </div>

    <div class="header-icons">
      <a href="https://ohiomafia.github.io/timecrisis/xml1.xml" title="Subscribe in podcast app"><img src="podcasts.svg" alt="Subscribe"></a>
      <a href="https://archive.org/details/tc-245-super-blue" title="Download"><img src="download.svg" alt="Download"></a>
    </div>
  </header>

  <main>
    <div id="grid"></div>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
