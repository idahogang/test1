<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Crisis — Episode Directory</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-title">
        <h1>Time Crisis</h1>
        <span class="subtitle">Episode Directory</span>
      </div>
      <div class="controls">
        <input type="search" id="search" placeholder="Search episodes, guests, descriptions…" autocomplete="off">
        <div class="selects">
          <select id="sort">
            <option value="newest">Newest to Oldest</option>
            <option value="oldest">Oldest to Newest</option>
          </select>
        </div>
      </div>
    </div>
    <div class="result-bar"><span id="count"></span></div>
  </header>

  <main>
    <div id="grid"></div>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
